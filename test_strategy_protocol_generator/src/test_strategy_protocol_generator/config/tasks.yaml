planning_task:
  description: >
    Act as the project lead for {topic}. Define concise testing objectives, responsibilities,
    priorities, and success criteria. Avoid narrating the team's workflow or repeating details
    covered by the requirements, strategy, and protocol. Treat {topic} as any kind
    of software product or system. Tailor the work to the project context and do not assume a
    particular industry or regulatory regime.
    {medical_device_mode_instructions}
    {medical_device_test_plan_instructions}
    Use the uploaded project documents as context when they are provided. Document context:
    {document_context}
  expected_output: >
    A short project scope and priorities, with only decisions needed to guide testing.
  agent: test_lead

research_task:
  description: >
    Identify 3-5 relevant software quality practices, standards, test techniques, and risks for
    {topic}. Tailor findings to the product type and technology shown in the uploaded documents.
    For General Software, do not assume a regulated domain. Do not invent sources, standards, or
    project facts; label assumptions and identify where current verification is needed.
    {medical_device_mode_instructions}
    Consider that the current year is {current_year}.
    Use the following uploaded project documentation as additional evidence and context:
    {document_context}
  expected_output: >
    A brief, source-specific list of the most relevant findings and their testing impact.
  agent: researcher

requirements_task:
  description: >
    Extract testable functional and non-functional requirements from project sources for {topic}.
    Do not create a requirement unless the source supports it.
    For General Software, include regulatory or compliance requirements only when supported by
    the supplied context.
    Keep each requirement to one sentence; list only consequential gaps or assumptions.
    {requirements_output_instructions}
    {medical_device_mode_instructions}
    Use the uploaded documentation as supporting context:
    {document_context}
  expected_output: >
    All relevant source-supported testable requirements, concisely stated with stable IDs.
  agent: requirements_analyst

strategy_task:
  description: >
    Based on the research and requirements, state only the testing approach needed for {topic}:
    test levels, environment, entry/exit criteria, and measurable acceptance criteria. Avoid
    repeating requirement descriptions or giving generic testing advice.
    {medical_device_mode_instructions}
    {medical_device_test_plan_instructions}
    Incorporate inputs from the uploaded documents and the project context below:
    {document_context}
  expected_output: >
    A concise, project-specific strategy with scope, approach, environment, and acceptance criteria.
  agent: test_strategy_architect

test_protocol_task:
  description: >
    Create a concise executable protocol for {topic}. State only prerequisites, environment/data,
    execution and evidence steps, pass/fail handling, and unresolved decisions. Do not repeat
    strategy or test-case details; test cases are provided separately.
    {medical_device_mode_instructions}
    {medical_device_protocol_instructions}
    Project documents:
    {document_context}
  expected_output: >
    Brief execution instructions, prerequisites, evidence handling, and pass/fail criteria.
  agent: test_strategy_architect

test_design_task:
  description: >
    Design concise, relevant test cases for {topic}, traceable to the
    requirement IDs from requirements analysis and risk/risk-control IDs from risk analysis.
    Reuse identifiers exactly; never create an unmapped requirement or risk ID. Cover applicable
    only applicable scenarios and avoid near-duplicates. For each case include an ID, objective,
    priority, test level, preconditions, steps, expected result, and linked requirement ID(s) and
    risk/risk-control ID(s) where applicable.
    Use short steps and one measurable expected result. Do not invent product behavior.
    {medical_device_mode_instructions}
    {medical_device_protocol_instructions}
    {test_design_output_instructions}
    For Medical Device Software, place the traceability matrix and verification test cases in
    separate sections with the exact headings required by the mode-specific instructions.
    The matrix must include every requirement from requirements analysis and every applicable
    risk control from the risk analysis. Use Pending / Not Verified when execution evidence is absent.
    Project documents:
    {document_context}
  expected_output: >
    The required mode-specific matrix and concise test cases. Do not duplicate the matrix in cases.
  agent: quality_assurance_engineer

automation_assessment_task:
  description: >
    Identify the most valuable manual and automated testing activities for {topic}. Give only
    project-supported candidates, key trade-offs, and a short next step. Do not assume tools.
    Project documents:
    {document_context}
  expected_output: >
    A short list of prioritized automation candidates with brief rationale and key manual checks.
  agent: test_strategy_architect

quality_task:
  description: >
    Review the draft for concrete traceability, execution, or acceptance gaps. Report only actionable
    findings; do not restate content that already passes review.
    {medical_device_mode_instructions}
    {medical_device_summary_instructions}
    Use the uploaded project documents as validation context:
    {document_context}
  expected_output: >
    A short list of actionable issues or "No additional issues identified."
  agent: quality_assurance_engineer

risk_task:
  description: >
    Identify only source-supported risks relevant to testing {topic}, prioritizing at most five.
    Include compliance risks only when relevant. State affected requirement, impact, and mitigation
    briefly; do not invent likelihood or acceptance ratings.
    {medical_device_mode_instructions}
    For Medical Device Software, preserve supplied risk identifiers and distinguish hazards,
    hazardous situations, harms, risk controls, and residual risk only where the source records
    support those distinctions. Do not invent risk acceptability decisions.
    Review the uploaded project documents for risk evidence and scope constraints:
    {document_context}
  expected_output: >
    A concise list of relevant source-supported risks, controls, and unknowns.
  agent: risk_manager

reporting_task:
  description: >
    Create a brief summary for {topic} with only important decisions, unresolved questions, and
    execution readiness. Do not repeat requirements, test cases, or matrix rows.
    For Medical Device Software, follow the verification summary sections, use only supplied
    execution evidence, and synthesize findings without duplicating full test cases or matrix rows.
    Use the uploaded project documents and all prior outputs as part of the final evidence base:
    {medical_device_mode_instructions}
    {medical_device_summary_instructions}
    {document_context}
  expected_output: >
    A short markdown summary with only actionable recommendations, assumptions, and open decisions.
    Formatted as markdown without '```'
  agent: reporting_analyst
