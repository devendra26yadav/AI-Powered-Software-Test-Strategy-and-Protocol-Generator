planning_task:
  description: >
    Act as the project lead for {topic}. Define the overall testing objectives, sequencing,
    responsibilities, and success criteria. Outline how the team will move from research to
    requirements, strategy, test design, validation, and reporting. Treat {topic} as any kind
    of software product or system. Tailor the work to the project context and do not assume a
    particular industry or regulatory regime.
    Use the uploaded project documents as context when they are provided. Document context:
    {document_context}
  expected_output: >
    A concise project plan and execution brief that defines the team workflow, priorities, deliverables,
    and decision points for the test strategy work.
  agent: test_lead

research_task:
  description: >
    Research relevant software quality practices, standards, test techniques, tools, and risks for
    {topic}. Tailor findings to the product type and technology shown in the uploaded documents.
    Do not assume healthcare or another regulated domain. Do not invent sources, standards, or
    project facts; label assumptions and identify where current verification is needed.
    Consider that the current year is {current_year}.
    Use the following uploaded project documentation as additional evidence and context:
    {document_context}
  expected_output: >
    A concise but evidence-based summary of the 10 most relevant findings about {topic},
    including why they matter to a software testing strategy.
  agent: researcher

requirements_task:
  description: >
    Review the project context and define the functional, non-functional, business, security,
    accessibility, compatibility, and operational requirements relevant to testing {topic}.
    Include regulatory or compliance requirements only when supported by the supplied context.
    Highlight gaps, assumptions, and scope boundaries.
    Use the uploaded documentation as supporting context:
    {document_context}
  expected_output: >
    A structured requirements brief covering scope, quality objectives, constraints, dependencies,
    and a prioritized list of testable requirements for {topic}.
  agent: requirements_analyst

strategy_task:
  description: >
    Based on the research and requirements, design a complete test strategy for {topic}.
    Include test levels, entry/exit criteria, coverage model, test design techniques,
    tooling, environment needs, and release readiness approach.
    Incorporate inputs from the uploaded documents and the project context below:
    {document_context}
  expected_output: >
    A comprehensive test strategy document with objectives, scope, coverage approach, test types,
    lifecycle phases, and execution plan for {topic}.
  agent: test_strategy_architect

test_protocol_task:
  description: >
    Create an executable test protocol for {topic} using the agreed scope, requirements, and
    strategy. Specify test phases, environment and data needs, roles, entry and exit criteria,
    execution workflow, evidence to retain, defect severity and escalation, and release decisions.
    Keep the protocol appropriate to the software type and identify unresolved assumptions.
    Project documents:
    {document_context}
  expected_output: >
    A standalone test protocol that a delivery team can follow, with clear phases, responsibilities,
    prerequisites, pass and fail criteria, defect handling, and release sign-off conditions.
  agent: test_strategy_architect

test_design_task:
  description: >
    Design representative test suites and detailed test cases for {topic}, traceable to the
    requirements and risks. Cover applicable positive, negative, boundary, integration, regression,
    security, accessibility, and performance scenarios. For each case include an ID, objective,
    priority, test level, preconditions, steps, expected result, and requirement or risk link.
    Avoid inventing product behavior that is not in the context; mark assumptions explicitly.
    Project documents:
    {document_context}
  expected_output: >
    A standalone test suite document containing grouped, prioritized, executable test cases and
    traceability to requirements or risks, plus any assumptions requiring confirmation.
  agent: quality_assurance_engineer

automation_assessment_task:
  description: >
    Compare manual and automated testing for {topic}. Identify which test activities are best kept
    manual, which should be automated, and which are candidates for a hybrid approach. Compare
    value, repeatability, setup and maintenance cost, feedback speed, required skills, and limitations.
    Recommend an incremental automation roadmap and suitable tool categories without assuming a
    specific technology stack unless the documents identify one.
    Project documents:
    {document_context}
  expected_output: >
    A standalone manual-versus-automation assessment with a comparison matrix, prioritized
    automation candidates, rationale, tool categories, and an incremental adoption roadmap.
  agent: test_strategy_architect

quality_task:
  description: >
    Critically review the draft strategy and verify that it is practical, measurable, and executable.
    Check for missing quality gates, unclear roles, incomplete test cases, and gaps in release validation.
    Use the uploaded project documents as validation context:
    {document_context}
  expected_output: >
    A QA validation report that identifies weaknesses, recommends improvements, and confirms
    the strategy is realistic for delivery and release operations.
  agent: quality_assurance_engineer

risk_task:
  description: >
    Evaluate product, technical, security, operational, delivery, and domain-specific risks for
    {topic}. Include compliance risks only when relevant to the project context. Identify failure
    modes, affected requirements, likelihood, impact, mitigations, and residual risks.
    Review the uploaded project documents for risk evidence and scope constraints:
    {document_context}
  expected_output: >
    A risk register with ranked risks, causes, affected areas, impact, likelihood, and mitigation actions.
  agent: risk_manager

reporting_task:
  description: >
    Create a concise executive summary that indexes and synthesizes the separate testing documents
    produced for {topic}. Note key decisions, assumptions, unresolved questions, and release-readiness
    recommendations. Do not replace or collapse the standalone deliverables into this summary.
    Use the uploaded project documents and all prior outputs as part of the final evidence base:
    {document_context}
  expected_output: >
    A standalone markdown executive summary with links or filenames for each generated deliverable,
    key recommendations, assumptions, and open decisions.
    Formatted as markdown without '```'
  agent: reporting_analyst
